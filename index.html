<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個網頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 新增：橫向導覽選單 -->
    <nav class="navbar">
        <a href="#nameSection">名字顯示</a>
        <a href="#introSection">自我介紹</a>
        <a href="#timeSection">時間判斷</a>
        <a href="#mathSection">乘法公式</a>
    </nav>

    <!-- 為了避免內容被固定的選單遮住，加一個主內容容器 -->
    <main class="content-container">

        <!-- 功能一：輸入名字並顯示 -->
        <div id="nameSection" class="card">
            <h1>我的第一個網頁</h1>
            <label for="myInput">請輸入你的名字</label>
            <input type="text" id="myInput">
            <button onclick="showValue()">送出</button>
            <div id="result"></div>
        </div>

        <!-- 功能二 & 三的卡片群組 -->
        <div class="card2">
            <!-- 功能二：自我介紹產生器 -->
            <div id="introSection" class="card3">
                <label for="introName">名字:</label>
                <input type="text" id="introName">
                <br>
                <label for="introHobby">興趣:</label>
                <input type="text" id="introHobby">
                <br>
                <label for="introBirthday">生日:</label>
                <input type="text" id="introBirthday">
                <br>
                <button onclick="generateIntro()">產生自我介紹</button>
                <div id="introResult"></div>
            </div>

            <hr>

            <!-- 功能三：時間判斷 -->
            <div id="timeSection" class="time-block">
                <label for="ji394su3">請輸入現在時間(小時)</label>
                <input type="text" id="ji394su3">
                <button onclick="showAgo()">送出</button>
                <div id="ageResult"></div>
            </div>
        </div>

        <!-- 功能四：乘法公式計算器 -->
        <div id="mathSection" class="card4">
            <h3>乘法公式計算器</h3>
            <label for="numA">數字 a:</label>
            <input type="number" id="numA">
            <br>
            <label for="numB">數字 b:</label>
            <input type="number" id="numB">
            <br>
            <button onclick="calculateMath()">計算結果</button>
            <div id="mathResult"></div>
        </div>

    </main>

    <!-- 載入 JavaScript 檔案 -->
    <script src="script.js"></script>
</body>
</html>
